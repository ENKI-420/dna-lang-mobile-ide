apiVersion: apps/v1
kind: Deployment
metadata:
  name: dnalang-mobile-ide
  labels:
    app: dnalang-mobile-ide
    app.kubernetes.io/name: dnalang-mobile-ide
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: dnalang
    app.openshift.io/runtime: nodejs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dnalang-mobile-ide
  template:
    metadata:
      labels:
        app: dnalang-mobile-ide
        deploymentconfig: dnalang-mobile-ide
    spec:
      containers:
        - name: dnalang-mobile-ide
          image: dnalang-mobile-ide:latest
          ports:
            - containerPort: 3000
              protocol: TCP
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: dnalang-mobile-ide
  labels:
    app: dnalang-mobile-ide
spec:
  selector:
    app: dnalang-mobile-ide
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: dnalang-mobile-ide
  labels:
    app: dnalang-mobile-ide
spec:
  to:
    kind: Service
    name: dnalang-mobile-ide
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
