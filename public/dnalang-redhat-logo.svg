<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="dnaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066cc;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00a0e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redhatAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ee0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc0000;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- DNA Logo -->
  <g id="dna-logo" transform="translate(20, 0)">
    <!-- DNA Double Helix -->
    <g id="dna-helix">
      <!-- Left strand -->
      <path d="M 60 20 Q 40 50, 60 80 Q 80 110, 60 140 Q 40 170, 60 200"
            stroke="url(#dnaGradient)"
            stroke-width="8"
            fill="none"
            stroke-linecap="round"/>

      <!-- Right strand -->
      <path d="M 140 20 Q 160 50, 140 80 Q 120 110, 140 140 Q 160 170, 140 200"
            stroke="url(#dnaGradient)"
            stroke-width="8"
            fill="none"
            stroke-linecap="round"/>

      <!-- Connecting bars -->
      <line x1="60" y1="35" x2="140" y2="35" stroke="url(#redhatAccent)" stroke-width="4"/>
      <line x1="60" y1="95" x2="140" y2="95" stroke="url(#redhatAccent)" stroke-width="4"/>
      <line x1="60" y1="155" x2="140" y2="155" stroke="url(#redhatAccent)" stroke-width="4"/>

      <!-- Nucleotide nodes -->
      <circle cx="60" cy="35" r="6" fill="url(#dnaGradient)"/>
      <circle cx="140" cy="35" r="6" fill="url(#dnaGradient)"/>
      <circle cx="60" cy="95" r="6" fill="url(#dnaGradient)"/>
      <circle cx="140" cy="95" r="6" fill="url(#dnaGradient)"/>
      <circle cx="60" cy="155" r="6" fill="url(#dnaGradient)"/>
      <circle cx="140" cy="155" r="6" fill="url(#dnaGradient)"/>
    </g>
  </g>

  <!-- DNA Lang Text -->
  <text x="220" y="90" font-family="Red Hat Display, Red Hat Text, Arial, sans-serif"
        font-size="48" font-weight="bold" fill="#000">
    DNA
    <tspan fill="url(#dnaGradient)">Lang</tspan>
  </text>
  <text x="220" y="120" font-family="Red Hat Text, Arial, sans-serif"
        font-size="24" font-weight="300" fill="#666">
    Mobile IDE
  </text>

  <!-- Powered by Red Hat -->
  <g id="redhat-badge" transform="translate(220, 135)">
    <rect x="0" y="0" width="200" height="35" rx="4" fill="url(#redhatAccent)"/>
    <text x="10" y="23" font-family="Red Hat Display, sans-serif"
          font-size="16" font-weight="500" fill="#fff">
      Powered by Red Hat
    </text>
    <!-- Red Hat Logo Icon -->
    <g transform="translate(165, 8)">
      <path d="M 18 8 C 16 8 14 10 12 10 C 10 10 8 8 8 6 C 8 4 10 2 12 2
               C 14 2 16 4 18 4 C 20 4 22 2 22 2 L 24 4 C 24 6 22 8 18 8 Z"
            fill="#fff"/>
      <path d="M 8 10 C 6 12 4 14 4 16 C 4 18 6 20 8 20 L 24 20 L 24 10 Z"
            fill="#fff" opacity="0.9"/>
    </g>
  </g>

  <!-- Version tag -->
  <text x="440" y="180" font-family="Red Hat Mono, monospace"
        font-size="14" fill="#999">
    v1.0.0
  </text>
</svg>
